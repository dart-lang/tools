name: sigstore
description: >
  Dart bindings for Sigstore wrapping sigstore-rust and package:boring for
  bundle inspection and cryptographic artifact verification.
version: 0.2.5-wip
repository: https://github.com/dart-lang/tools/tree/main/pkgs/sigstore
issue_tracker: https://github.com/dart-lang/tools/labels/package%3Asigstore

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.6.0
  boring: ^0.4.2
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.1.4
  hooks: ^2.2.0
  meta: ^1.16.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.0
  test: ^1.25.0

hooks:
  user_defines:
    sigstore:
      buildMode: checkout

topics:
  - security
  - cryptography
  - sigstore
  - verification
  - ffi
