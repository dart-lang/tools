name: sigstore
description: >
  Dart bindings for Sigstore wrapping sigstore-rs for bundle inspection
  and cryptographic artifact verification.
version: 0.1.4
repository: https://github.com/dart-lang/tools/tree/main/pkgs/sigstore
issue_tracker: https://github.com/dart-lang/tools/labels/package%3Asigstore

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  args: ^2.6.0
  code_assets: ^1.0.0
  crypto: ^3.0.7
  ffi: ^2.1.4
  hooks: ^2.1.0
  meta: ^1.17.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.0
  test: ^1.25.0

hooks:
  user_defines:
    sigstore:
      buildMode: checkout
