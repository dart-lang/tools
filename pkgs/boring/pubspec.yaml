name: boring
description: >-
  Raw FFI bindings to BoringSSL, compiled and bundled through Dart Native
  Assets.
version: 0.4.2-wip
repository: https://github.com/dart-lang/tools/tree/main/pkgs/boring
issue_tracker: https://github.com/dart-lang/tools/issues?q=is%3Aissue+is%3Aopen+label%3Apackage%3Aboring

environment:
  # Dart 3.13.3 is the first Dart version to support native asset cross-compilation
  # using `dart build cli`.
  sdk: ^3.13.3

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.6
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.4
  native_toolchain_cmake: ^0.3.2
  record_use: ^1.1.0

dev_dependencies:
  args: ^2.7.0
  dart_flutter_team_lints: ^3.5.2
  ffi: ^2.2.0
  ffigen: ^22.0.0
  test: ^1.32.0

# User-defines only apply from the root package, so this makes the tests and
# the example of this package build the vendored BoringSSL from source instead
# of downloading the prebuilt libraries. It has no effect on packages that
# depend on boring.
hooks:
  user_defines:
    boring:
      buildMode: checkout

topics:
  - crypto
  - ffi
  - security
