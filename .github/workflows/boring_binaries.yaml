# Builds the prebuilt libraries that hook/build.dart uses in the `fetch` build
# mode, adds them to the prebuilt/ directory of package:boring, and tests the
# package archive with them. On a `boring-v<version>` tag, it then calls
# `dart-lang/setup-dart/.github/workflows/publish.yml` (`bundled-files`,
# `attest: true`) to stage the libraries into an isolated checkout, attest the
# package archive's SLSA Build L3 provenance, and publish it to pub.dev, so the
# libraries come with the package instead of being downloaded. publish.yaml
# skips these tags, as it would publish the package without them.
#
# The libraries are built from the tagged commit, so they match the vendored
# BoringSSL that the `checkout` build mode compiles.
#
# Also runs, without publishing, on pull requests that change the native build,
# the hooks, or this pipeline, when a change to the native sources (src/, the
# vendored BoringSSL, or this pipeline) lands on main, for example the weekly
# BoringSSL update, and on `workflow_dispatch`.
name: package:boring binaries
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    # Path filters don't apply to tags.
    tags: [ 'boring-v[0-9]+.[0-9]+.[0-9]+*' ]
    paths:
      - '.github/actions/setup-nasm/**'
      - '.github/workflows/boring_binaries.yaml'
      - 'pkgs/boring/src/**'
      - 'pkgs/boring/third_party/boringssl/**'
      - 'pkgs/boring/tool/REVISION'
      - 'pkgs/boring/tool/precompile_binaries.dart'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/actions/setup-nasm/**'
      - '.github/workflows/boring_binaries.yaml'
      - 'pkgs/boring/.pubignore'
      - 'pkgs/boring/hook/**'
      - 'pkgs/boring/lib/src/hook_helpers/**'
      - 'pkgs/boring/pubspec.yaml'
      - 'pkgs/boring/src/**'
      - 'pkgs/boring/test/prebuilt_test.dart'
      - 'pkgs/boring/tool/precompile_binaries.dart'
  workflow_dispatch:

# Cancels the superseded runs of a pull request, but never a publishing run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs compilers and other build tools, so it only gets `contents: read` and
  # cannot mint OIDC tokens.
  precompile:
    name: Precompile (${{ matrix.target-os }}-${{ matrix.target-arch }}${{ matrix.ios-sdk && format('-{0}', matrix.ios-sdk) || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pkgs/boring/
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `prebuiltTargets` in lib/src/hook_helpers/targets.dart.
        # `max-glibc` and `min-os` are the ABI floors that the libraries are
        # checked against below. Keep `min-os` in sync with
        # `macOSDeploymentTargets` and `iOSDeploymentTarget` in
        # tool/precompile_binaries.dart.
        include:
          # The oldest available Ubuntu, so the libraries only require glibc
          # 2.35.
          - os: ubuntu-22.04
            target-os: linux
            target-arch: x64
            max-glibc: '2.35'
          - os: ubuntu-22.04-arm
            target-os: linux
            target-arch: arm64
            max-glibc: '2.35'
          - os: macos-15
            target-os: macos
            target-arch: arm64
            min-os: '11.0'
          - os: macos-15
            target-os: macos
            target-arch: x64
            min-os: '10.15'
          - os: windows-latest
            target-os: windows
            target-arch: x64
          - os: macos-15
            target-os: ios
            target-arch: arm64
            ios-sdk: iphoneos
            min-os: '12.0'
          - os: macos-15
            target-os: ios
            target-arch: arm64
            ios-sdk: iphonesimulator
            # The arm64 simulator only exists since iOS 14.
            min-os: '14.0'
          - os: macos-15
            target-os: ios
            target-arch: x64
            ios-sdk: iphonesimulator
            min-os: '12.0'
          # The Android libraries don't depend on the host, so any Ubuntu does.
          - os: ubuntu-24.04
            target-os: android
            target-arch: arm
          - os: ubuntu-24.04
            target-os: android
            target-arch: arm64
          - os: ubuntu-24.04
            target-os: android
            target-arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: stable
      - name: Setup NASM
        if: matrix.target-os == 'windows'
        uses: ./.github/actions/setup-nasm
      - name: Install dependencies
        run: dart pub get
      # Builds the dynamic library, which is bundled when linking is disabled,
      # and the static library, which hook/link.dart links into a dynamic
      # library with only the functions an application uses, in
      # prebuilt/<target>/.
      - name: Precompile the libraries
        env:
          TARGET_OS: ${{ matrix.target-os }}
          TARGET_ARCH: ${{ matrix.target-arch }}
          IOS_SDK: ${{ matrix.ios-sdk }}
        run: |
          dart run tool/precompile_binaries.dart --target-os="$TARGET_OS" --target-arch="$TARGET_ARCH" \
            ${IOS_SDK:+--ios-sdk="$IOS_SDK"} \
            ${ANDROID_NDK_LATEST_HOME:+--android-ndk="$ANDROID_NDK_LATEST_HOME"}
      - name: List the libraries
        run: ls -lR prebuilt
      # The dynamic library is bundled as is, so it must run on every OS version
      # that Dart and Flutter support, not only on the build machine's.
      - name: Check the ABI floor of the dynamic library (Linux)
        if: matrix.target-os == 'linux'
        env:
          MAX_GLIBC: ${{ matrix.max-glibc }}
        run: |
          glibc="$(objdump -T prebuilt/*/*.so | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)"
          echo "Newest glibc symbol version: $glibc (allowed: $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$glibc" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::The library requires glibc $glibc, newer than $MAX_GLIBC. Build on an older runner."
            exit 1
          fi
      - name: Check the ABI floor of the dynamic library (macOS, iOS)
        if: matrix.target-os == 'macos' || matrix.target-os == 'ios'
        env:
          MIN_OS: ${{ matrix.min-os }}
          TARGET_OS: ${{ matrix.target-os }}
        run: |
          minos="$(otool -l prebuilt/*/*.dylib | awk '/minos/ {print $2}' | sort -u)"
          echo "Minimum $TARGET_OS version: $minos (expected: $MIN_OS)"
          if [ "$minos" != "$MIN_OS" ]; then
            echo "::error::The library requires $TARGET_OS '$minos' instead of $MIN_OS. Check the deployment targets in tool/precompile_binaries.dart."
            exit 1
          fi
      - name: Check the ABI of the dynamic library (Android)
        if: matrix.target-os == 'android'
        env:
          TARGET_ARCH: ${{ matrix.target-arch }}
        run: |
          # Android 15+ requires 16 KB page alignment of 64-bit native
          # libraries, and the libraries must only depend on the C library
          # (see src/CMakeLists.txt), not on libc++_shared.so.
          case "$TARGET_ARCH" in
            arm|ia32) expected_alignment=0x1000 ;;
            *) expected_alignment=0x4000 ;;
          esac
          alignments="$(readelf -lW prebuilt/*/*.so | awk '$1 == "LOAD" {print $NF}' | sort -u)"
          needed="$(readelf -d prebuilt/*/*.so | awk '/NEEDED/ {print $NF}' | tr -d '[]' | sort -u | tr '\n' ' ')"
          echo "LOAD segment alignment: $alignments (expected: $expected_alignment)"
          echo "Needed libraries: $needed"
          readelf -n prebuilt/*/*.so | grep -A2 'Android' || true
          if [ "$alignments" != "$expected_alignment" ]; then
            echo "::error::The LOAD segments are aligned to $alignments instead of $expected_alignment. Use NDK r28 or newer, or ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES."
            exit 1
          fi
          case " $needed" in
            *" libc++"*|*" libstdc++"*)
              echo "::error::The library depends on a C++ runtime: $needed. See the C++ runtime notes in src/CMakeLists.txt."
              exit 1
              ;;
          esac
      - name: Check the ABI floor of the dynamic library (Windows)
        if: matrix.target-os == 'windows'
        run: |
          # The C runtime is linked statically (see src/CMakeLists.txt), so the
          # DLL must not import the Visual C++ Redistributable's DLLs.
          imports="$(grep -a -o -i -E '(vcruntime|msvcp|msvcr)[0-9_]*\.dll|api-ms-win-crt-[a-z0-9-]*\.dll' prebuilt/*/*.dll | sort -u || true)"
          if [ -n "$imports" ]; then
            echo "$imports"
            echo "::error::The DLL imports the C runtime dynamically. Check CMAKE_MSVC_RUNTIME_LIBRARY in src/CMakeLists.txt."
            exit 1
          fi
          echo "The DLL doesn't import the C runtime dynamically."
      - name: Stage prebuilt libraries
        run: |
          mkdir -p "$RUNNER_TEMP/bundled-files"
          cp -r prebuilt "$RUNNER_TEMP/bundled-files/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundled-files-${{ matrix.target-os }}-${{ matrix.target-arch }}${{ matrix.ios-sdk && format('-{0}', matrix.ios-sdk) || '' }}
          path: ${{ runner.temp }}/bundled-files/
          if-no-files-found: error

  # Adds the libraries of all targets to prebuilt/, where hook/build.dart looks
  # for them, and creates a package archive for `test` (including on fork PRs,
  # where `publish` cannot run because OIDC tokens are unavailable).
  # pkgs/boring/.pubignore, unlike .gitignore, doesn't ignore prebuilt/.
  package:
    name: Create the test package archive
    needs: precompile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkgs/boring/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: bundled-files-*
          path: pkgs/boring
          merge-multiple: true
      - name: Install dependencies
        run: dart pub get
      - name: Validate the package
        run: dart pub publish --dry-run
      - name: Create the package archive
        run: dart pub publish --to-archive="$RUNNER_TEMP/package.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-package-archive
          path: ${{ runner.temp }}/package.tar.gz
          if-no-files-found: error

  # Builds the example against the package archive like an app that depends on
  # package:boring from pub.dev, in the default `fetch` build mode, see
  # test/prebuilt_test.dart. On each desktop OS, cross-compiles to Linux with
  # and without a cross-toolchain (hook/link.dart uses different linker flags
  # on each).
  test:
    name: Test the package archive (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pkgs/boring/
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: stable
      # `dart test` builds this package from source, see pubspec.yaml.
      - name: Setup NASM
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-nasm
      - name: Install Linux cross toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install Linux cross toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              url="https://github.com/messense/homebrew-macos-cross-toolchains/releases/download/v15.2.0/aarch64-unknown-linux-gnu-aarch64-darwin.tar.gz"
              expected="0f224db36d8572489f09ed5bce39f189eee998f9ab4f8ea07f510d6c7078caa3"
              ;;
            x86_64)
              url="https://github.com/messense/homebrew-macos-cross-toolchains/releases/download/v15.2.0/aarch64-unknown-linux-gnu-x86_64-darwin.tar.gz"
              expected="7fa485313b7049d57c5de56bf876d5c4648ebfd736f86a8f4739596218523127"
              ;;
            *)
              echo "::error::Unsupported macOS architecture: $(uname -m)"
              exit 1
              ;;
          esac
          curl -fSL -o "$RUNNER_TEMP/aarch64-linux-gnu.tar.gz" "$url"
          actual="$(shasum -a 256 < "$RUNNER_TEMP/aarch64-linux-gnu.tar.gz" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected SHA-256 $expected for $url, got $actual."
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/aarch64-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/aarch64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - name: Install Linux cross toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-mingw-w64-x86_64-aarch64-none-linux-gnu.zip
          # From the .sha256asc file published next to the zip.
          TOOLCHAIN_SHA256: 9428b2039923916418ec7037025be8cec3202926d65db9452519977834ad2a89
        run: |
          curl -fSL -o "$RUNNER_TEMP/arm-gnu-toolchain.zip" "$TOOLCHAIN_URL"
          actual="$(sha256sum < "$RUNNER_TEMP/arm-gnu-toolchain.zip" | cut -d' ' -f1)"
          if [ "$actual" != "$TOOLCHAIN_SHA256" ]; then
            echo "::error::Expected SHA-256 $TOOLCHAIN_SHA256 for $TOOLCHAIN_URL, got $actual."
            exit 1
          fi
          7z x "$RUNNER_TEMP/arm-gnu-toolchain.zip" -o"$RUNNER_TEMP/arm-gnu-toolchain" -y >/dev/null
          BIN_DIR="$RUNNER_TEMP/arm-gnu-toolchain/bin"
          for f in "$BIN_DIR"/aarch64-none-linux-gnu-*.exe; do
            cp "$f" "${f/aarch64-none-linux-gnu-/aarch64-linux-gnu-}"
          done
          cygpath -w "$BIN_DIR" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: test-package-archive
          path: ${{ runner.temp }}
      - name: Extract the package archive
        shell: bash
        working-directory: ${{ runner.temp }}
        run: mkdir boring && tar -xzf package.tar.gz -C boring
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        env:
          BORING_PACKAGE_DIR: ${{ runner.temp }}/boring
        run: dart test test/prebuilt_test.dart

  # Stages `bundled-files-*` into an isolated checkout via setup-dart's reusable
  # publishing workflow, generates SLSA Build L3 provenance (`attest: true`),
  # and publishes on `boring-v<version>` tags (running in `test-run` mode on
  # non-tag runs from this repository).
  publish:
    name: Publish to pub.dev
    needs: [precompile, test]
    if: >-
      !cancelled() &&
      github.repository_owner == 'dart-lang' &&
      needs.precompile.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref_type == 'tag' && needs.test.result == 'success') ||
        (github.ref_type != 'tag' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
      )
    permissions:
      id-token: write # To authenticate with pub.dev and sign the attestation.
      attestations: write # To store the package attestation.
    # TODO(mosuem): Repin to `main` / `@v1` once dart-lang/setup-dart#210, #212,
    # and #213 land.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@05f6f8a1c44c614ffa21021a13d34089858e5e8e # publish-bundled-files
    with:
      working-directory: pkgs/boring
      use-flutter: false
      attest: true
      test-run: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}
      # Keep in sync with `prebuiltTargets` in lib/src/hook_helpers/targets.dart.
      bundled-files: |
        prebuilt/android-arm/libbssl_dart.so
        prebuilt/android-arm/libbssl_dart_static.a
        prebuilt/android-arm64/libbssl_dart.so
        prebuilt/android-arm64/libbssl_dart_static.a
        prebuilt/android-x64/libbssl_dart.so
        prebuilt/android-x64/libbssl_dart_static.a
        prebuilt/ios-arm64-iphoneos/libbssl_dart.dylib
        prebuilt/ios-arm64-iphoneos/libbssl_dart_static.a
        prebuilt/ios-arm64-iphonesimulator/libbssl_dart.dylib
        prebuilt/ios-arm64-iphonesimulator/libbssl_dart_static.a
        prebuilt/ios-x64-iphonesimulator/libbssl_dart.dylib
        prebuilt/ios-x64-iphonesimulator/libbssl_dart_static.a
        prebuilt/linux-arm64/libbssl_dart.so
        prebuilt/linux-arm64/libbssl_dart_static.a
        prebuilt/linux-x64/libbssl_dart.so
        prebuilt/linux-x64/libbssl_dart_static.a
        prebuilt/macos-arm64/libbssl_dart.dylib
        prebuilt/macos-arm64/libbssl_dart_static.a
        prebuilt/macos-x64/libbssl_dart.dylib
        prebuilt/macos-x64/libbssl_dart_static.a
        prebuilt/windows-x64/bssl_dart.dll
        prebuilt/windows-x64/bssl_dart_static.lib
