name: package:snippets
permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/snippets.yaml'
      - 'pkgs/snippets/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/snippets.yaml'
      - 'pkgs/snippets/**'
  schedule:
    - cron: '0 0 * * 0' # weekly

defaults:
  run:
    working-directory: pkgs/snippets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, dev]
        include:
          - sdk: dev
            check-formatting: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - run: dart format --output=none --set-exit-if-changed .
        if: ${{ matrix.check-formatting }}

      - run: dart test
