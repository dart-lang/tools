# A CI configuration to auto-publish pub packages.

name: Publish
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    # Match <package-name>-v<version> publish tags, except package:boring's,
    # which boring_binaries.yaml publishes with its prebuilt libraries.
    tags:
      - '[A-z0-9]+-v[0-9]+.[0-9]+.[0-9]+'
      - '!boring-v*'

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@27c2fc841818cce349e1f424af51cca9ea381f47
    with:
      write-comments: false
    permissions:
      id-token: write
      pull-requests: write
