name: package:cli_config
permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/cli_config.yml"
      - "pkgs/cli_config/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cli_config.yml"
      - "pkgs/cli_config/**"
  schedule:
    - cron: "0 0 * * 0" # weekly

defaults:
  run:
    working-directory: pkgs/cli_config/

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [stable, dev]
        include:
          - sdk: stable
            run-tests: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{matrix.sdk}}

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - run: dart format --output=none --set-exit-if-changed .
        if: ${{matrix.run-tests}}

      - run: dart test
        if: ${{matrix.run-tests}}

      - name: Install coverage
        run: dart pub global activate coverage
        if: ${{ matrix.sdk == 'stable' }}
      - name: Collect coverage
        run: dart pub global run coverage:test_with_coverage
        if: ${{ matrix.sdk == 'stable' }}
      - name: Upload coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: cli_config_linux
          path-to-lcov: ./pkgs/cli_config/coverage/lcov.info
        if: ${{ matrix.sdk == 'stable' }}

  build_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        sdk: [stable, dev]
        include:
          - sdk: stable
            run-tests: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{matrix.sdk}}

      - run: dart pub get

      - run: dart test
        if: ${{matrix.run-tests}}
