name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@fc3dd9a17a8e18b3b4aa5abac8a0f4a679fe2d57
    with:
      ignore_coverage: "**.mock.dart,**.g.dart,**/bin/**,**/example/**,**/hook/**,**/tool/**,**/hook_helpers/**,pkgs/sigstore/lib/sigstore.dart"
      ignore_license: "**.mock.dart,**.g.dart,**.mocks.dart,pkgs/markdown/**"
      license_test_string: "// Copyright"
      license: |
        // Copyright (c) %YEAR%, the Dart project authors. Please see the AUTHORS file
        // for details. All rights reserved. Use of this source code is governed by a
        // BSD-style license that can be found in the LICENSE file.
    permissions:
      pull-requests: write
