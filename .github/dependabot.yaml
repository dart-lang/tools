# Dependabot configuration file.
version: 2
enable-beta-ecosystems: true

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - autosubmit
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directories:
      - "/pkgs/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - autosubmit
    versioning-strategy: increase-if-necessary
